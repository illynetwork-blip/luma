<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Luma</title>
<meta name="description" content="Luma, sport et soin de soi : un défi de 28 jours personnalisé. Séances guidées à la maison, plan de repas, respiration, sommeil et suivi des progrès.">
<meta name="theme-color" content="#F3F4F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D0F14" media="(prefers-color-scheme: dark)">
<meta name="application-name" content="Luma">
<meta name="apple-mobile-web-app-title" content="Luma">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<meta property="og:title" content="Luma · sport et soin de soi">
<meta property="og:description" content="Votre défi de 28 jours, conçu à partir de vos réponses : séances de 15 à 30 minutes, repas, respiration et sommeil.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/luma-32.png">
<link rel="apple-touch-icon" href="icons/luma-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://images.unsplash.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;600;700&family=Onest:wght@400;500;600;700&display=swap">
<style>
/* Luma · direction : clair « porcelaine » froid, encre presque noire, un seul halo chaud (aube corail → abricot → rose)
   réservé aux moments clés. Photos plein cadre, verre dépoli pour les barres, grandes cartes arrondies.
   Mise en page : une colonne mobile (max 520 px) centrée, barre d'en-tête et barre d'onglets en verre. */
:root{
  --bg:#F3F4F7; --surface:#FFFFFF; --surface-2:#ECEEF3; --ink:#101218; --ink-2:#4A4F5C; --ink-3:#7D8290; --line:#E1E4EA;
  --accent:#F2603B; --accent-ink:#FFFFFF; --accent-soft:#FFE9E1; --ok:#1E9E74; --ok-soft:#DDF4EA; --warn:#C9831A; --warn-soft:#FBF0DA; --bad:#D9455B;
  --btn:#101218; --btn-ink:#FFFFFF; --btn-off:#C9CCD4;
  --glass:rgba(243,244,247,.72); --glass-line:rgba(16,18,24,.07); --scrim:rgba(13,15,20,.55);
  --aura:linear-gradient(125deg,#FFC27A 0%,#FF7A55 48%,#F0567A 100%);
  --ph:linear-gradient(140deg,#FFD9C2,#F7B6A8 45%,#D9C9F2);
  --shadow:0 18px 40px -18px rgba(16,18,24,.28); --shadow-s:0 6px 18px -10px rgba(16,18,24,.25);
  --f-display:"Unbounded","Arial Rounded MT Bold",system-ui,sans-serif;
  --f-body:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r-l:28px; --r-m:20px; --r-s:14px;
  --top:env(safe-area-inset-top,0px); --bot:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D0F14; --surface:#171A21; --surface-2:#20242D; --ink:#F2F3F6; --ink-2:#B9BDC8; --ink-3:#848A98; --line:#2A2F3A;
  --accent:#FF7A55; --accent-ink:#14161C; --accent-soft:#3A2119; --ok:#3CC796; --ok-soft:#14322A; --warn:#E8A93F; --warn-soft:#352914; --bad:#F06A7E;
  --btn:#F2F3F6; --btn-ink:#101218; --btn-off:#3A3F4B;
  --glass:rgba(13,15,20,.7); --glass-line:rgba(255,255,255,.08); --scrim:rgba(0,0,0,.6);
  --ph:linear-gradient(140deg,#3B2620,#4A2B33 45%,#2C2840);
  --shadow:0 18px 40px -18px rgba(0,0,0,.7); --shadow-s:0 6px 18px -10px rgba(0,0,0,.6);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0D0F14; --surface:#171A21; --surface-2:#20242D; --ink:#F2F3F6; --ink-2:#B9BDC8; --ink-3:#848A98; --line:#2A2F3A;
  --accent:#FF7A55; --accent-ink:#14161C; --accent-soft:#3A2119; --ok:#3CC796; --ok-soft:#14322A; --warn:#E8A93F; --warn-soft:#352914; --bad:#F06A7E;
  --btn:#F2F3F6; --btn-ink:#101218; --btn-off:#3A3F4B;
  --glass:rgba(13,15,20,.7); --glass-line:rgba(255,255,255,.08); --scrim:rgba(0,0,0,.6);
  --ph:linear-gradient(140deg,#3B2620,#4A2B33 45%,#2C2840);
  --shadow:0 18px 40px -18px rgba(0,0,0,.7); --shadow-s:0 6px 18px -10px rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:var(--top);z-index:40;background:var(--glass);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-appearance:none;appearance:none;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:10px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;letter-spacing:-.02em;text-wrap:balance;margin:0}
h1{font-size:clamp(24px,6.4vw,30px);line-height:1.15}
h2{font-size:20px;line-height:1.2}
h3{font-size:16px;line-height:1.25;font-weight:500}
p{margin:0}
a{color:inherit}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)}
.eyebrow{font:600 11px/1.2 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.aura-text{background:var(--aura);-webkit-background-clip:text;background-clip:text;color:transparent}
.shell{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;position:relative;display:flex;flex-direction:column}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:700px){
  body{background:radial-gradient(1200px 600px at 50% -10%,var(--accent-soft),transparent 60%),var(--bg)}
  .shell{box-shadow:0 0 0 1px var(--line)}
}

/* ---------- photos (Unsplash) avec dégradé de secours ---------- */
.ph{position:relative;overflow:hidden;background:var(--ph);isolation:isolate}
.ph>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .5s ease}
.ph>img.on{opacity:1}
.ph.top-focus>img{object-position:50% 22%}

/* ---------- en-tête (tunnel) ---------- */
.top{position:sticky;top:var(--top);z-index:30;background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);border-bottom:1px solid var(--glass-line)}
.top-in{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;min-height:58px;padding-block:6px}
.icon-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--ink)}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn svg{width:22px;height:22px}
.top-mid{text-align:center;display:grid;gap:7px;justify-items:center}
.brand{font:600 19px/1 var(--f-display);letter-spacing:-.03em;display:inline-flex;align-items:center;gap:8px}
.brand svg{width:24px;height:24px;border-radius:7px}
:root[data-theme=dark] .brand svg,.dark .brand svg{box-shadow:0 0 0 1px rgba(255,255,255,.16)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .brand svg{box-shadow:0 0 0 1px rgba(255,255,255,.16)}}
.sec-title{font:600 15px/1.1 var(--f-body)}
.prog{display:flex;gap:5px;width:min(220px,60vw)}
.prog i{flex:1;height:4px;border-radius:4px;background:var(--line);overflow:hidden;position:relative}
.prog i b{position:absolute;inset:0 auto 0 0;background:var(--ink);border-radius:4px;transition:width .35s ease}

/* ---------- étapes ---------- */
main{flex:1;display:flex;flex-direction:column}
.step{flex:1;padding-block:22px 140px;display:flex;flex-direction:column;gap:18px;animation:in .35s ease both}
@keyframes in{from{opacity:.0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.step-head{display:grid;gap:8px;text-align:center}
.step-head.left{text-align:left}
.step-head .sub{color:var(--ink-2);font-size:15px}
.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-m);padding:16px 16px;min-height:62px;font-weight:500;font-size:15px;line-height:1.3;transition:border-color .15s,background .15s,transform .1s}
.opt:hover{border-color:var(--ink-3)}
.opt:active{transform:scale(.985)}
.opt .lab{flex:1;min-width:0;display:grid;gap:2px}
.opt .lab small{font-weight:400;color:var(--ink-2);font-size:13px}
.opt .mark{flex:none;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--ink-3);display:grid;place-items:center;transition:all .15s}
.opt.multi .mark{border-radius:8px}
.opt .mark svg{width:14px;height:14px;opacity:0;color:var(--btn-ink)}
.opt[aria-checked="true"]{border-color:var(--ink);background:var(--surface-2)}
.opt[aria-checked="true"] .mark{background:var(--ink);border-color:var(--ink)}
.opt[aria-checked="true"] .mark svg{opacity:1}
.opt .ico{flex:none;width:40px;height:40px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;color:var(--ink)}
.opt .ico svg{width:22px;height:22px}
.opt.photo{flex-direction:column;align-items:stretch;padding:0;overflow:hidden;gap:0}
.opt.photo .ph{aspect-ratio:1/1;max-width:100%}
.opt.photo .row{display:flex;align-items:center;gap:10px;padding:12px 14px}
.opt.fig{flex-direction:column;align-items:stretch;gap:10px;padding:14px}
.opt.fig .figbox{height:110px;display:grid;place-items:center;border-radius:14px;background:var(--surface-2)}
.opt.fig .row{display:flex;align-items:center;gap:10px}
.grp-label{font:600 11px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-top:6px}
.side{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:10px;align-items:start}
.side .opts{align-self:start}
.side .side-ph{border-radius:var(--r-l);aspect-ratio:3/5;max-width:100%;position:sticky;top:90px}
@media (max-width:360px){.side{grid-template-columns:1fr}.side .side-ph{display:none}}
.hero-ph{border-radius:var(--r-l);aspect-ratio:16/11;max-width:100%;box-shadow:var(--shadow)}
.hero-ph.tall{aspect-ratio:4/5}
.info-body{display:grid;gap:12px;color:var(--ink-2);font-size:16px}
.info-body b{color:var(--ink);font-weight:600}
.note{display:flex;gap:12px;align-items:flex-start;padding:16px;border-radius:var(--r-m);background:var(--surface);border:1px solid var(--line);font-size:14px;color:var(--ink-2)}
.note svg{flex:none;width:22px;height:22px;color:var(--ink)}
.note.ok{background:var(--ok-soft);border-color:transparent}
.note.ok svg{color:var(--ok)}
.note.warn{background:var(--warn-soft);border-color:transparent}
.note.warn svg{color:var(--warn)}
.note b{color:var(--ink)}

/* ---------- saisie de mesures ---------- */
.seg{display:inline-flex;margin:0 auto;background:var(--surface-2);border-radius:999px;padding:4px}
.seg button{padding:8px 20px;border-radius:999px;font-weight:600;font-size:14px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-s)}
.big-in{display:flex;align-items:baseline;gap:10px;border-bottom:2px solid var(--line);padding:6px 4px;transition:border-color .2s}
.big-in:focus-within{border-color:var(--ink)}
.big-in input{flex:1;min-width:0;border:0;background:none;outline:0;font:600 44px/1.1 var(--f-display);letter-spacing:-.03em;text-align:center;padding:0}
.big-in input::placeholder{color:var(--line)}
.big-in .unit{font:500 22px var(--f-display);color:var(--ink-2)}
.big-in.text input{font-size:34px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.hint{font-size:13px;color:var(--ink-3);text-align:center}
.field{display:grid;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--ink-2)}
.field input,.field select,.field textarea{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r-s);padding:14px 14px;font-size:16px;outline:0}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--ink)}
.check{display:flex;gap:12px;align-items:flex-start;font-size:13px;color:var(--ink-2);cursor:pointer;text-align:left}
.check input{flex:none;width:22px;height:22px;margin:0;accent-color:var(--ink)}
.check a{color:var(--ink);font-weight:600}

/* ---------- bouton d'action (bas de l'écran) ---------- */
.cta{position:fixed;left:0;right:0;bottom:0;z-index:25;pointer-events:none}
.cta-in{max-width:520px;margin:0 auto;padding-block:14px calc(14px + var(--bot));background:linear-gradient(to top,var(--bg) 62%,transparent);display:grid;gap:8px;pointer-events:auto}
.sec-h>button{min-height:40px;padding:0 4px}
a.btn{text-decoration:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:58px;border-radius:999px;background:var(--btn);color:var(--btn-ink);font:600 16px/1 var(--f-body);letter-spacing:.01em;box-shadow:var(--shadow);transition:transform .1s,background .2s,opacity .2s}
.btn:active{transform:scale(.98)}
.btn[disabled]{background:var(--btn-off);box-shadow:none;cursor:not-allowed;color:var(--btn-ink)}
.btn.aura{background:var(--aura);color:#1A0E0A}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:none;min-height:46px}
.btn.small{min-height:44px;width:auto;padding:0 20px;font-size:14px;box-shadow:none}
.btn.line{background:var(--surface);color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn svg{width:20px;height:20px}

/* ---------- accueil du tunnel ---------- */
.land{padding-block:8px 40px;display:grid;gap:18px}
.land-hero{border-radius:0 0 var(--r-l) var(--r-l);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));min-height:300px;display:flex;align-items:flex-end;color:#fff}
.land-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(13,15,20,0) 30%,rgba(13,15,20,.78));z-index:0}
.land-hero .in{position:relative;z-index:1;padding:26px max(18px,env(safe-area-inset-left,0px)) 24px;display:grid;gap:10px}
.land-hero h1{color:#fff;font-size:clamp(28px,8vw,38px)}
.land-hero p{color:rgba(255,255,255,.86);font-size:15px;max-width:34ch}
.pill{display:inline-flex;align-items:center;gap:8px;width:max-content;padding:7px 12px;border-radius:999px;background:rgba(255,255,255,.18);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);font:600 12px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:#fff}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--aura)}
.age-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.age{position:relative;border-radius:var(--r-m);overflow:hidden;aspect-ratio:4/5;max-width:100%;text-align:left;color:#fff;box-shadow:var(--shadow-s);transition:transform .15s}
.age:hover{transform:translateY(-2px)}
.age .ph{position:absolute;inset:0}
.age .ph::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(13,15,20,.7))}
.age .lbl{position:absolute;left:10px;right:10px;bottom:10px;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.16);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);font-weight:600;font-size:15px}
.age .lbl svg{width:20px;height:20px}
.legal{font-size:12.5px;color:var(--ink-3);text-align:center}
.legal a{color:var(--ink-2)}
.login-link{justify-self:center;font-weight:600;font-size:14px;text-decoration:underline;text-underline-offset:3px;color:var(--ink-2);padding:6px}

/* ---------- graphiques ---------- */
.chart-card{background:var(--surface);border-radius:var(--r-l);padding:18px 16px 14px;border:1px solid var(--line)}
.chart-card>svg{display:block;width:100%;height:auto;overflow:visible}
.chart-card text{fill:var(--ink-3);font:500 11px var(--f-body)}
.bars{display:flex;align-items:flex-end;gap:8px;height:190px;padding:12px;border-radius:var(--r-l);background:var(--surface);border:1px solid var(--line)}
.bars div{flex:1;border-radius:14px 14px 8px 8px;background:var(--surface-2);display:flex;flex-direction:column;justify-content:space-between;padding:8px 6px;font-size:11.5px;font-weight:600;text-align:center;color:var(--ink-2);min-width:0}
.bars div:last-child{background:var(--aura);color:#1A0E0A}
.bars small{font-weight:500;color:var(--ink-3)}
.bars div:last-child small{color:rgba(26,14,10,.7)}

/* ---------- analyse, profil ---------- */
.an-row{display:grid;gap:8px}
.an-row .hd{display:flex;justify-content:space-between;font-weight:600}
.an-bar{height:8px;border-radius:8px;background:var(--line);overflow:hidden}
.an-bar b{display:block;height:100%;width:0;background:var(--ink);border-radius:8px;transition:width .2s linear}
.gauge{position:relative;padding-top:38px}
.gauge .scale{height:10px;border-radius:10px;background:linear-gradient(90deg,#6FB7E8 0%,#5CCB9B 22%,#5CCB9B 45%,#F2C14E 66%,#F08A4B 82%,#E5506A 100%)}
.gauge .dot{position:absolute;top:30px;width:22px;height:22px;margin-left:-11px;border-radius:50%;background:var(--surface);border:4px solid var(--ink);box-shadow:var(--shadow-s)}
.gauge .tag{position:absolute;top:0;transform:translateX(-50%);background:var(--ink);color:var(--btn-ink);font-weight:700;font-size:12.5px;padding:5px 10px;border-radius:10px;white-space:nowrap}
.gauge .ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-3);margin-top:8px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fact{background:var(--surface-2);border-radius:var(--r-s);padding:12px;display:grid;gap:2px}
.fact span{font-size:12px;color:var(--ink-3)}
.fact b{font-weight:600;font-size:15px;line-height:1.25}
.ring{position:relative;width:170px;height:170px;margin:0 auto}
.ring>svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;font:600 40px var(--f-display)}
.ring .v small{font-size:18px}
.list-ck{display:grid;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden}
.list-ck div{display:flex;gap:12px;align-items:center;padding:14px 16px;border-top:1px solid var(--line);font-weight:500;font-size:15px}
.list-ck div:first-child{border-top:0}
.list-ck svg{flex:none;width:22px;height:22px;color:var(--ok)}

/* ---------- carte à gratter ---------- */
.scratch{position:relative;border-radius:var(--r-l);aspect-ratio:4/3.6;max-width:100%;overflow:hidden;background:var(--ink);color:var(--btn-ink);user-select:none;-webkit-user-select:none;touch-action:none}
.scratch .prize{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px;background:var(--aura);color:#1A0E0A}
.scratch .prize b{display:block;font:700 64px/1 var(--f-display);letter-spacing:-.04em}
.scratch canvas{position:absolute;inset:0;width:100%;height:100%;cursor:grab}
.promo{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-radius:var(--r-m);background:var(--ok-soft);font-weight:600}
.promo svg{width:18px;height:18px;vertical-align:-3px;color:var(--ok)}
.promo code{font:600 15px var(--f-body);letter-spacing:.02em}

/* ---------- offres ---------- */
.plans{display:grid;gap:12px}
.plan{position:relative;display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-m);padding:18px 16px}
.plan .mark{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--ink-3);display:grid;place-items:center}
.plan .mark svg{width:14px;height:14px;opacity:0;color:var(--btn-ink)}
.plan[aria-checked="true"]{border-color:var(--ink);box-shadow:var(--shadow)}
.plan[aria-checked="true"] .mark{background:var(--ink);border-color:var(--ink)}
.plan[aria-checked="true"] .mark svg{opacity:1}

.tier-bar{display:flex;gap:12px;align-items:center;width:100%;padding:12px 14px;border-radius:var(--r-m);background:var(--surface);border:1px solid var(--line);text-align:left}.tier-bar b{display:block}.tier-bar small{font-size:12.5px;color:var(--ink-3)}.tier-bar>svg{width:18px;height:18px;color:var(--ink-3)}
.tier-n{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font:700 14px var(--f-display);color:#fff;flex:none}.tier-n.t0{background:#3CB58A}.tier-n.t1{background:#3E8BE0}.tier-n.t2{background:linear-gradient(135deg,#FF8A5B,#F0567A)}.tier-n.t3{background:linear-gradient(135deg,#1A1C24,#5A3FD1);box-shadow:0 0 0 2px #E3B341 inset}
.tiers{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tier{position:relative;display:grid;gap:4px;justify-items:start;text-align:left;padding:12px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface)}.tier small{font-size:12px;color:var(--ink-3);line-height:1.3}
.tier[aria-pressed=true]{border-color:var(--ink);box-shadow:var(--shadow-s)}.tier em{position:absolute;top:10px;right:10px;font-style:normal;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--surface-2);color:var(--ink-2)}.tier.rec em{background:var(--accent);color:#fff}
.adapt{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:var(--r-m);background:var(--accent-soft);color:var(--ink);font-size:14px}
.adapt>svg{flex:none;width:22px;height:22px;color:var(--accent)}.adapt p{margin:0 0 4px}.adapt .btn{margin-top:6px;width:auto;padding:0 18px;min-height:44px}
.bilan{display:grid;gap:8px;margin:6px 0}.bilan h3{margin:0}.bilan .note{text-align:left}
.rpe{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.rpe button{display:grid;gap:2px;justify-items:center;padding:10px 2px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:11.5px;line-height:1.15;color:var(--ink-2)}
.rpe button b{font-size:20px;color:var(--ink)}.rpe button[aria-checked=true]{background:var(--ink);border-color:var(--ink);color:var(--bg)}.rpe button[aria-checked=true] b{color:var(--bg)}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.inst-bar{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 14px;border-radius:var(--r-m);background:var(--ink);color:var(--bg);box-shadow:var(--shadow)}
.inst-bar>svg:first-child{flex:none;width:26px;height:26px;padding:6px;box-sizing:content-box;border-radius:12px;background:var(--aura);color:#1A0E0A}
.inst-bar span{flex:1;display:grid;gap:1px}.inst-bar b{font-size:15.5px}.inst-bar small{font-size:12.5px;opacity:.72}.inst-bar>svg:last-child{width:18px;height:18px;opacity:.7}
.land .inst-bar{margin:4px 0 2px}
.ins-head{display:flex;gap:14px;align-items:center}.ins-head img{border-radius:16px;box-shadow:var(--shadow)}.ins-head h2{margin:0}.ins-head p{margin:2px 0 0}
.ins-card{border:1px solid var(--line);border-radius:var(--r-m);padding:14px 16px;background:var(--surface)}.ins-card.on{border-color:var(--ink);box-shadow:var(--shadow)}
.ins-card h3{margin:0 0 6px;font-size:16px}.ins-card ol{margin:0;padding-left:20px;display:grid;gap:7px;font-size:14.5px;color:var(--ink-2)}.ins-card b{color:var(--ink)}
.ins-k{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:8px;background:var(--surface-2);vertical-align:middle;white-space:nowrap}.ins-k svg{width:16px;height:16px;color:var(--ink)}
.exv.anim{background:var(--surface);color:var(--ink)}
.exv.anim svg{width:100%;height:100%;display:block}
.exv.small{aspect-ratio:16/9}
.ply .exv{max-height:34vh;width:100%}
.timer.compact{width:150px;height:150px}
.timer.compact .t{font-size:42px}

/* ---------- feuille du bas, message ---------- */
.sheet-bg{position:fixed;inset:0;z-index:70;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{width:min(520px,100%);max-height:88vh;overflow:auto;background:var(--bg);border-radius:var(--r-l) var(--r-l) 0 0;padding-block:10px calc(22px + var(--bot));display:grid;gap:14px;animation:up .28s cubic-bezier(.2,.8,.2,1) both}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet .grab{width:44px;height:5px;border-radius:5px;background:var(--line);justify-self:center}
.sheet .ph.hero{border-radius:var(--r-m);aspect-ratio:16/10;max-width:100%}
.sheet ol,.sheet ul{margin:0;padding-left:20px;display:grid;gap:6px;color:var(--ink-2)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + var(--bot));z-index:90;background:var(--ink);color:var(--btn-ink);padding:12px 18px;border-radius:999px;font-weight:600;font-size:14px;box-shadow:var(--shadow);max-width:calc(100% - 32px);animation:in .25s ease both}
.fete{position:fixed;inset:0;pointer-events:none;z-index:95;overflow:hidden}
.fete i{position:absolute;top:-20px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.menu-list{display:grid;gap:4px}
.menu-list button,.menu-list a{display:flex;align-items:center;gap:12px;padding:14px 12px;border-radius:var(--r-s);font-weight:600;text-decoration:none;text-align:left;width:100%}
.menu-list button:hover,.menu-list a:hover{background:var(--surface-2)}
.menu-list svg{width:22px;height:22px}
.legal-page{display:grid;gap:12px;color:var(--ink-2);font-size:14.5px}
.legal-page h3{color:var(--ink);margin-top:8px}
.splash{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:var(--bg);transition:opacity .4s}
.splash svg{width:84px;height:84px;border-radius:22px;box-shadow:var(--shadow)}
</style>
